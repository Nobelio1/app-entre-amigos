ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.entreamigos.backend.ApplicationKt.module ]
    }
}

database {
    url = "jdbc:postgresql://localhost:5432/entreamigos"
    url = ${?DB_URL}
    user = "entreamigos"
    user = ${?DB_USER}
    password = "entreamigos"
    password = ${?DB_PASSWORD}
    maxPoolSize = 10
}
