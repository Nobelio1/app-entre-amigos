ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.entreamigos.backend.ApplicationKt.module ]
    }
}

database {
    url = "jdbc:postgresql://localhost:5432/entreamigos"
    url = ${?DB_URL}
    user = "entreamigos"
    user = ${?DB_USER}
    password = "entreamigos"
    password = ${?DB_PASSWORD}
    maxPoolSize = 10
    # Carga db/seed.sql (usuarios del equipo + grupo demo) si la base no tiene usuarios
    seed = true
    seed = ${?DB_SEED}
}

firebase {
    # ID del proyecto de Firebase (Configuración del proyecto → General → ID del proyecto).
    # Vacío = inicio de sesión con Google deshabilitado (POST /auth/google responde 503).
    projectId = ""
    projectId = ${?FIREBASE_PROJECT_ID}
}

jwt {
    # En producción define JWT_SECRET con un valor largo y aleatorio
    secret = "entreamigos-dev-secret-cambiar-en-produccion"
    secret = ${?JWT_SECRET}
    issuer = "entreamigos-api"
    audience = "entreamigos-app"
    validezDias = 30
    validezDias = ${?JWT_VALIDEZ_DIAS}
}
